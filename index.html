const Utils = (() => {
  const q=(s,p=document)=>p.querySelector(s), qa=(s,p=document)=>[...p.querySelectorAll(s)];
  const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const id=(prefix='ID')=>`${prefix}-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).slice(2,7).toUpperCase()}`;
  const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const toDateKey=v=>{
    if(v===null||v===undefined||v==='')return '';
    if(v instanceof Date)return isNaN(v)?'':dateKey(v);
    if(typeof v==='number'&&Number.isFinite(v)){
      if(v>1e11){const d=new Date(v);return isNaN(d)?'':dateKey(d)}
      if(v>1e9){const d=new Date(v*1000);return isNaN(d)?'':dateKey(d)}
      if(v>20000&&v<100000){const d=new Date(Date.UTC(1899,11,30)+v*86400000);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}
    }
    const s=String(v).trim();
    let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    const d=new Date(s);return isNaN(d)?'':dateKey(d)
  };
  const sameDate=(v,key)=>toDateKey(v)===toDateKey(key);
  const today=()=>dateKey();
  const isoNow=()=>new Date().toISOString();
  const formatDate=(v,opt={day:'2-digit',month:'short',year:'numeric'})=>{const k=toDateKey(v);if(!k)return v?String(v):'-';const d=new Date(k+'T00:00:00');return d.toLocaleDateString('id-ID',opt)};
  const formatDateTime=v=>{if(!v)return '-';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})};
  const num=v=>new Intl.NumberFormat('id-ID').format(Number(v)||0);
  const parseJSON=(v,fallback=[])=>{if(Array.isArray(v)||typeof v==='object'&&v!==null)return v;let cur=v;for(let i=0;i<3&&typeof cur==='string';i++){const text=cur.trim();if(!text)return fallback;try{cur=JSON.parse(text)}catch{return fallback}}return Array.isArray(cur)||typeof cur==='object'&&cur!==null?cur:fallback};
  const initials=n=>String(n||'U').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
  const debounce=(fn,wait=250)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),wait)}};
  const idle=(fn,timeout=120)=>{if('requestIdleCallback' in window)return requestIdleCallback(()=>fn(),{timeout});return setTimeout(fn,0)};
  const toast=(msg,type='')=>{const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=msg;q('#toastRoot').appendChild(el);setTimeout(()=>el.remove(),3200)};
  const statusBadge=s=>{const c=/publish|selesai|approved|insight/i.test(s)?'green':/review|planning|proses/i.test(s)?'blue':/revisi|urgent/i.test(s)?'red':/produksi/i.test(s)?'orange':'gray';return `<span class="badge badge-${c}">${esc(s||'-')}</span>`};
  const download=(name,content,type='text/plain;charset=utf-8')=>{const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},100)};
  const copy=async text=>{try{await navigator.clipboard.writeText(text);toast('Berhasil disalin','success')}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Berhasil disalin','success')}};
  const modal=(title,body,foot='',size='')=>{q('#modalRoot').innerHTML=`<div class="modal-overlay"><div class="modal ${size}"><div class="modal-head"><h3>${esc(title)}</h3><button class="close-btn" data-close-modal>✕</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`;qa('[data-close-modal]').forEach(x=>x.onclick=closeModal);q('.modal-overlay').addEventListener('click',e=>{if(e.target.classList.contains('modal-overlay'))closeModal()})};
  const closeModal=()=>q('#modalRoot').innerHTML='';
  const printDocument=(title,html)=>{const w=window.open('','_blank','width=900,height=800');if(!w){toast('Pop-up diblokir browser','error');return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Arial,sans-serif;color:#111827;margin:0}.page{padding:38px 48px}.header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #be185d;padding-bottom:14px}.logo{width:58px;height:58px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden;border:1px solid #e5e7eb}.logo img{width:100%;height:100%;object-fit:contain}.org{font-size:12px;color:#64748b}.title{font-size:24px;margin:24px 0 5px}.date{font-size:12px;color:#64748b;margin-bottom:24px}.section{margin:18px 0}.section h3{font-size:13px;text-transform:uppercase;color:#be185d;border-bottom:1px solid #e5e7eb;padding-bottom:6px}.section p,.section li,.section td{font-size:12px;line-height:1.65}.section table{width:100%;border-collapse:collapse}.section th,.section td{border:1px solid #e5e7eb;padding:8px;text-align:left}.footer{margin-top:40px;border-top:1px solid #e5e7eb;padding-top:10px;font-size:10px;color:#f9a8d4;text-align:center}@media print{@page{size:A4;margin:0}.no-print{display:none}}</style></head><body><div class="page"><div class="header"><div><strong>${esc(Config.data.organization)}</strong><div class="org">Content Management System</div></div><div class="logo"><img src="${APP_LOGO_DATA}" alt="Logo MEDIA WG"></div></div>${html}<div class="footer">Dokumen dibuat melalui ${esc(Config.data.appName)} • ${new Date().toLocaleString('id-ID')}</div></div><script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);w.document.close()};
  const xmlEsc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const exportXls=(name,sheets)=>{let worksheets='';Object.entries(sheets).forEach(([sheetName,rows])=>{worksheets+=`<Worksheet ss:Name="${xmlEsc(sheetName.slice(0,31))}"><Table>`+rows.map(r=>'<Row>'+r.map(c=>`<Cell><Data ss:Type="${typeof c==='number'?'Number':'String'}">${xmlEsc(c)}</Data></Cell>`).join('')+'</Row>').join('')+'</Table></Worksheet>'});const xml=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${worksheets}</Workbook>`;download(name,xml,'application/vnd.ms-excel')};
  const formData=form=>Object.fromEntries(new FormData(form).entries());
  const beginSubmit=(button,message='Apakah data sudah benar dan siap disimpan? Klik OK satu kali saja untuk mencegah data ganda.',busyText='Menyimpan...')=>{
    if(!button)return null;
    if(button.dataset.submitting==='1'){toast('Data sedang diproses. Mohon tunggu hingga selesai.','error');return null}
    if(!window.confirm(message))return null;
    const original=button.innerHTML;
    button.dataset.submitting='1';button.disabled=true;button.innerHTML=`⏳ ${esc(busyText)}`;
    return ()=>{if(button.isConnected){button.disabled=false;button.innerHTML=original;delete button.dataset.submitting}}
  };
  return {q,qa,esc,id,today,dateKey,toDateKey,sameDate,isoNow,formatDate,formatDateTime,num,parseJSON,initials,debounce,idle,toast,statusBadge,download,copy,modal,closeModal,printDocument,exportXls,formData,beginSubmit};
})();

    const id=String(form?.elements?.id?.value||'').trim();

  };
  document.addEventListener('click',e=>{
    const btn=e.target.closest('button[id]');if(!btn)return;const cfg=configs[btn.id];if(!cfg)return;
    const form=Utils.q('#'+cfg.form);if(form&&!form.reportValidity()){e.preventDefault();e.stopImmediatePropagation();return}

  },true);
  return {configs};

const Auth = (() => {
  // v1.22.7: login persisten per perangkat. Menutup tab/browser tidak menghapus sesi.
  // Sesi hanya dihapus saat Logout atau token benar-benar dicabut di server.
  const KEY='govcms_session_persistent_v1227';
  const LEGACY_KEY='govcms_session_v1';
  const readStored=()=>{
    let stored=null;
    try{stored=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}
    // Migrasi sesi aktif versi lama tanpa meminta login ulang saat update.
    if(!stored){try{stored=JSON.parse(sessionStorage.getItem(LEGACY_KEY)||'null')}catch{}if(stored){try{localStorage.setItem(KEY,JSON.stringify(stored))}catch{}}}
    try{sessionStorage.removeItem(LEGACY_KEY)}catch{}
    return stored&&stored.token&&stored.user?stored:null;
  };
  let session=readStored();
  const clearLocal=()=>{try{localStorage.removeItem(KEY)}catch{}try{sessionStorage.removeItem(LEGACY_KEY)}catch{}};
  const set=s=>{
    session=s;Auth.session=s;
    if(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
    else clearLocal();
  };
  const login=async(username,password)=>{
    if(typeof BackgroundSyncManager!=='undefined')BackgroundSyncManager.reset?.();
    if(typeof ReferenceManager!=='undefined')ReferenceManager.reset?.();
    if(typeof Store!=='undefined')Store.resetSession?.();
    // v1.22.10: login modern hanya memakai challenge/proof JSONP.
    // Tidak lagi menunggu iframe/fetch lama bila endpoint salah atau transport gagal.
    let out;
    const modernSecure=!!(window.crypto?.subtle&&typeof TextEncoder!=='undefined');
    if(!modernSecure){
      out=await API.call('loginSimple',{username,password},{skipQueue:true,silentSessionExpiry:true});
    }else{
      let firstErr=null;
      try{
        out=await API.secureLogin(username,password);
      }catch(err){
        firstErr=err;
        const msg=String(err?.message||'');
        if(/username atau password salah|username dan password wajib/i.test(msg))throw err;
        // Pastikan login selalu kembali ke Core resmi, lalu retry sekali.
        Config.data.apiUrl=Config.CORE_FALLBACK_URL;
        await new Promise(r=>setTimeout(r,180));
        try{out=await API.secureLogin(username,password);}
        catch(coreErr){
          const finalMsg=String(coreErr?.message||coreErr);
          if(/username atau password salah/i.test(finalMsg))throw coreErr;
          throw new Error('Login Core gagal: '+finalMsg+' (jalur secure JSONP).');
        }
      }
    }
    const s=out?.session||out;set(s);
    if(out?.apiInfo&&typeof Store!=='undefined')Store.apiInfo=out.apiInfo;
    if(out?.reference_pack&&typeof ReferenceManager!=='undefined')await ReferenceManager.apply(out.reference_pack,{persist:true});
    setTimeout(()=>{API.retryFastWrites?.();API.retryBriefWrites?.()},120);
    return s
  };
  let expiring=false;
  const expire=(message='Sesi tidak lagi valid. Silakan masuk kembali.')=>{
    if(expiring||!session)return;expiring=true;
    clearLocal();session=null;Auth.session=null;try{BackgroundSyncManager?.reset?.();ReferenceManager?.reset?.()}catch{}
    // Normalnya tidak terjadi karena sesi server persisten sampai Logout.
    // Jalur ini hanya untuk token yang dicabut/invalid atau akun yang tidak lagi dapat digunakan.
    try{Utils.toast(message,'warning')}catch{}
    setTimeout(()=>{try{location.hash='';App.renderLogin()}finally{expiring=false}},250);
  };
  const logout=()=>{
    const token=String(session?.token||'');
    // Kirim revoke sebelum state lokal dibersihkan. Tidak memblokir UX Logout.
    if(token&&!API.isDemo()){try{API.call('logoutSession',{}, {skipQueue:true,silentSessionExpiry:true}).catch(()=>{})}catch{}}
    clearLocal();session=null;Auth.session=null;
    try{BackgroundSyncManager?.reset?.();ReferenceManager?.reset?.()}catch{}
    Store.resetSession?.();location.hash='';if(typeof OfflineQueue!=='undefined')OfflineQueue.render();App.renderLogin();
  };
  const can=(...roles)=>!!session&&roles.includes(session.user.role);
  return {session,login,logout,expire,can,set};
})()

  const SECONDARY=['hotIssues','footages','meetings','htmlDocuments'];
  let running=false,currentId='',cursor=0,timer=0,lastError='',initialHydrated=false,secondaryLoaded=new Set(),syncScheduled=0,lastInteraction=0,activityBound=false,boostedKind='';
  function bindActivity(){if(activityBound)return;activityBound=true;['pointerdown','keydown','input','wheel','touchstart'].forEach(type=>document.addEventListener(type,()=>{lastInteraction=Date.now()},{passive:true,capture:true}))}
  async function waitForIdle(minIdle=650,maxWait=2600){bindActivity();const started=Date.now();while(Date.now()-lastInteraction<minIdle&&Date.now()-started<maxWait)await new Promise(r=>setTimeout(r,100));}
  const state=()=>({running,currentId,cursor,error:lastError,total:2+SECONDARY.length,done:(Store.isModuleReady('briefs')?1:0)+(Store.isModuleReady('tasks')?1:0)+[...secondaryLoaded].length});
  function emit(id,status='done'){window.dispatchEvent(new CustomEvent('mwg:sync-module',{detail:{id,status,state:state()}}));window.dispatchEvent(new CustomEvent('mwg:sync-state',{detail:{id,status,state:state()}}));renderIndicator()}
  function derived(){if(Store.isModuleReady('briefs')&&Store.isModuleReady('tasks'))['calendar','kanban','reporting'].forEach(id=>{Store.markModule(id,{derived:true});emit(id,'done')})}
  async function hydrateKind(kind){try{const c=await ClientCache.getModule(kind);if(!c)return false;const p=c.payload||c.data||c;if(!Array.isArray(p.rows))return false;Store.applyModule(kind,{...p,full:true,complete_index:true},true);Store.moduleMeta[kind]={...(Store.moduleMeta[kind]||{}),revision:String(c.revision||p.revision||''),complete_index:true,from_cache:true};return true}catch{return false}}
  async function hydrateInitialCache(){if(initialHydrated)return true;initialHydrated=true;const meta=await ClientCache.getMeta('sync_v122').catch(()=>null);cursor=Number(meta?.cursor||0)||0;await Promise.all(['briefs','tasks'].map(hydrateKind));if(typeof CalendarModule!=='undefined')await CalendarModule.hydrateCachedDefault?.().catch(()=>false);derived();Promise.all(SECONDARY.map(async k=>{if(await hydrateKind(k))secondaryLoaded.add(k)})).then(()=>renderIndicator()).catch(()=>{});return true}
  async function persistKind(kind,payload){await Store.persistModule(kind,{...(payload||{}),full:true,complete_index:true}).catch(()=>{});}
  async function fullCore(){currentId='briefs';emit('briefs','running');const out=await API.call('getCoreIndexV122',{}, {skipQueue:true});Store.applyModule('briefs',{kind:'briefs',rows:out.briefs||[],full:true,complete_index:true,generated_at:out.generated_at},false);Store.applyModule('tasks',{kind:'tasks',rows:out.tasks||[],full:true,complete_index:true,generated_at:out.generated_at},false);await Promise.all([persistKind('briefs',{kind:'briefs',rows:Store.briefs,generated_at:out.generated_at}),persistKind('tasks',{kind:'tasks',rows:Store.tasks,generated_at:out.generated_at})]);cursor=Number(out.cursor||0)||cursor;await ClientCache.setMeta('sync_v122',{cursor});derived();emit('briefs','done');emit('tasks','done');currentId='';return out}
  async function fullCoreKind(kind){if(!['briefs','tasks'].includes(kind))return null;currentId=kind;emit(kind,'running');const out=await API.call('getModuleIndexV122',{kind},{skipQueue:true});Store.applyModule(kind,{kind,rows:out.rows||[],full:true,complete_index:true,generated_at:out.generated_at},false);await persistKind(kind,{kind,rows:Store[kind]||[],generated_at:out.generated_at});derived();emit(kind,'done');currentId='';return out}
  async function fullSecondary(kind){if(kind==='meetings'&&Auth.session?.user?.role!=='SUPERADMIN')return;if(kind==='htmlDocuments'&&!['SUPERADMIN','ANALIS'].includes(Auth.session?.user?.role))return;currentId=kind;emit(kind,'running');const out=await API.call('getModuleIndexV122',{kind},{skipQueue:true});Store.applyModule(kind,{kind,rows:out.rows||[],full:true,complete_index:true,generated_at:out.generated_at},false);await persistKind(kind,{kind,rows:Store[kind]||[],generated_at:out.generated_at});secondaryLoaded.add(kind);emit(kind,'done');currentId=''}
  async function applyChanges(out){const mods=out?.modules||{};for(const [kind,p] of Object.entries(mods)){if(!p)continue;Store.applyModule(kind,{kind,rows:p.rows||[],deleted_ids:p.deleted_ids||[],full:false,complete_index:true,generated_at:out.generated_at},false);if(typeof CalendarModule!=='undefined'&&(kind==='briefs'||kind==='tasks'))CalendarModule.seedChangedRows?.(kind,p.rows||[]);await persistKind(kind,{kind,rows:Store[kind]||[],generated_at:out.generated_at});emit(kind,'done')}const refresh=[...new Set(out?.refresh_modules||[])],coreRefresh=refresh.filter(k=>['briefs','tasks'].includes(k));if(coreRefresh.length===2)await fullCore();else if(coreRefresh.length===1)await fullCoreKind(coreRefresh[0]);for(const kind of refresh){if(coreRefresh.includes(kind))continue;if(kind==='accounts'||kind==='templates'){try{await ReferenceManager.ensure({force:true});emit(kind,'done')}catch{}}else if(SECONDARY.includes(kind))await fullSecondary(kind)}derived()}
  async function syncDelta(){if(!cursor)return fullCore();const out=await API.call('getSyncChangesV122',{cursor},{skipQueue:true});if(out?.full_required)return fullCore();await applyChanges(out);cursor=Number(out?.cursor||cursor)||cursor;await ClientCache.setMeta('sync_v122',{cursor});Store.lastSyncAt=out?.generated_at||Utils.isoNow();return out}
  async function start(){if(running||!Auth.session)return;running=true;lastError='';bindActivity();renderIndicator();try{await hydrateInitialCache();await ReferenceManager.ensure().catch(()=>false);await syncDelta();setTimeout(()=>{try{CalendarModule.preloadDefault?.()}catch{}},80);const queue=SECONDARY.slice();while(queue.length){let kind='';if(boostedKind&&queue.includes(boostedKind)){kind=boostedKind;queue.splice(queue.indexOf(kind),1);boostedKind=''}else kind=queue.shift();if(!Store.isModuleReady(kind)){await waitForIdle();await fullSecondary(kind)}}await syncDelta().catch(()=>{});setTimeout(async()=>{await waitForIdle(900,4000);InsightTracker.preload?.().catch(()=>{})},900);setTimeout(async()=>{await waitForIdle(900,5000);AIStudio.preload?.().catch(()=>{})},1800)}catch(e){lastError=String(e?.message||e);console.warn('Simple sync:',lastError)}finally{running=false;currentId='';renderIndicator();schedulePolling()}}
  function schedulePolling(){clearTimeout(timer);if(!Auth.session)return;timer=setTimeout(async()=>{if(document.hidden){schedulePolling();return}try{await refreshAll()}catch{}},90000)}
  function scheduleSync(delay=500){clearTimeout(syncScheduled);syncScheduled=setTimeout(()=>{refreshAll().catch(()=>{})},delay)}
  async function refreshAll(){if(running||!Auth.session)return;running=true;renderIndicator();try{await syncDelta()}catch(e){lastError=String(e?.message||e)}finally{running=false;currentId='';renderIndicator();schedulePolling()}}
  async function refreshCore(){return refreshAll()}
  function routeReady(){return true}
  function waitingHtml(){return ''}
  function boostRoute(route){const map={hotissues:'hotIssues',footages:'footages',meetings:'meetings',htmlfiles:'htmlDocuments'},kind=map[route];if(!kind||Store.isModuleReady(kind))return;if(running){boostedKind=kind;return}running=true;currentId=kind;renderIndicator();(async()=>{try{await fullSecondary(kind)}catch(e){lastError=String(e?.message||e)}finally{running=false;currentId='';renderIndicator();schedulePolling()}})()}
  function boost(){ }
  function renderIndicator(){const el=Utils.q('#globalSyncIndicator');if(!el)return;let label='Data siap',short='✓',cls='ok';if(running){label=currentId?`Sinkron ${currentId}`:'Memeriksa perubahan';short='↻';cls='syncing'}if(lastError){label='Data cache aktif • sync tertunda';short='⚠';cls='warn'}el.className='sync-indicator '+cls;el.innerHTML=`<span class="sync-dot"></span><span class="sync-label">${Utils.esc(label)}</span><span class="sync-short">${short}</span>`;el.title=label}
  function retryErrors(){lastError='';scheduleSync(50)}
  function reset(){clearTimeout(timer);clearTimeout(syncScheduled);running=false;currentId='';cursor=0;lastError='';initialHydrated=false;secondaryLoaded=new Set();boostedKind='';renderIndicator()}
  return {start,hydrateInitialCache,boost,boostRoute,routeReady,waitingHtml,state,renderIndicator,retryErrors,refreshAll,refreshCore,reset,scheduleSync};
})();

const FormDraft = (() => {
  const PREFIX='mwg_form_draft_v160_';
  const userKey=()=>Auth.session?.user?.id||Auth.session?.user?.username||'guest';
  const key=(entity,id)=>`${PREFIX}${userKey()}_${entity}_${id||'new'}`;
  function capture(form,extra){
    const counters={},fields=[];
    [...form.elements].forEach(el=>{if(!el.name||['button','submit','file'].includes(el.type))return;const i=counters[el.name]||0;counters[el.name]=i+1;fields.push({name:el.name,index:i,type:el.type,value:el.value,checked:!!el.checked})});
    return {saved_at:Date.now(),fields,extra:extra?extra():null};
  }
  function restore(form,data,before){
    if(before)before(data.extra||null);
    (data.fields||[]).forEach(item=>{const els=[...form.elements].filter(x=>x.name===item.name),el=els[item.index||0];if(!el)return;if(['checkbox','radio'].includes(item.type))el.checked=!!item.checked;else el.value=item.value??''});
    form.dispatchEvent(new Event('change',{bubbles:true}));
  }
  function attach(form,{entity,recordId,captureExtra,restoreExtra}){
    const draftKey=key(entity,recordId),raw=localStorage.getItem(draftKey);let timer=null;
    const bar=document.createElement('div');bar.className='draft-bar';
    const saved=raw?Utils.parseJSON(raw,null):null;
    bar.innerHTML=saved?`<div><strong>Draft lokal ditemukan</strong><span>Disimpan ${Utils.formatDateTime(new Date(saved.saved_at).toISOString())}</span><div class="draft-save-note" data-draft-status>Autosave aktif</div></div><div class="actions"><button type="button" class="btn btn-sm btn-primary" data-draft-restore>Lanjutkan</button><button type="button" class="btn btn-sm" data-draft-discard>Buang</button></div>`:`<div><strong>Autosave aktif</strong><span>Isian disimpan sementara di perangkat.</span><div class="draft-save-note" data-draft-status>Belum ada perubahan</div></div>`;
    form.prepend(bar);
    const status=bar.querySelector('[data-draft-status]');
    const save=()=>{try{localStorage.setItem(draftKey,JSON.stringify(capture(form,captureExtra)));if(status)status.textContent='Draft tersimpan • '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}catch(e){}};
    const schedule=()=>{clearTimeout(timer);timer=setTimeout(save,700)};
    form.addEventListener('input',schedule);form.addEventListener('change',schedule);
    bar.querySelector('[data-draft-restore]')?.addEventListener('click',()=>{restore(form,saved,restoreExtra);Utils.toast('Draft lokal dipulihkan','success');bar.querySelector('.actions')?.remove()});
    bar.querySelector('[data-draft-discard]')?.addEventListener('click',()=>{localStorage.removeItem(draftKey);bar.remove();Utils.toast('Draft lokal dibuang')});
    return {clear(){clearTimeout(timer);localStorage.removeItem(draftKey)},save,draftKey};
  }
  return {attach};
})();

const EditConflict = (() => {
  function isConflict(error){return /^EDIT_CONFLICT\|/.test(String(error?.message||''))}
  function handle(error,route){
    if(!isConflict(error))return false;
    const parts=String(error.message).split('|'),msg=parts[1]||'Data telah diubah pengguna lain.';
    Utils.toast(msg+' Muat ulang sebelum menyimpan.','error');
    if(confirm(msg+'\n\nMuat ulang data terbaru sekarang?')){Utils.closeModal();App.reload(route,true)}
    return true;
  }
  return {isConflict,handle};
})();

const ErrorReporter = (() => {
  const KEY='MWG_ERROR_DEDUP_V1222',TTL=10*60*1000,MAX=80;
  let sending=false,initialized=false,lastSentAt=0;
  function messageOf(error){return String(error?.message||error||'Unknown error').trim()||'Unknown error'}
  function shouldIgnore(error,context={}){
    const msg=messageOf(error),file=String(context.file||'');
    // JSONP/cross-origin dan ekstensi browser sering hanya memunculkan "Script error."
    // tanpa stack/filename yang dapat ditindaklanjuti. Error API sebenarnya sudah ditangani API.call/jsonpCall.
    if(/^script error\.?$/i.test(msg))return true;
    if(/^(chrome|moz|safari-web)-extension:/i.test(file))return true;
    return false;
  }
  function fingerprint(source,error,context={}){return [source,location.hash.slice(1),messageOf(error),context.file||'',context.line||'',context.column||''].join('|').slice(0,1200)}
  function seenRecently(key){
    const now=Date.now();let rows=[];try{rows=JSON.parse(sessionStorage.getItem(KEY)||'[]');if(!Array.isArray(rows))rows=[]}catch{rows=[]}
    rows=rows.filter(x=>x&&now-Number(x.t||0)<TTL);if(rows.some(x=>x.k===key)){try{sessionStorage.setItem(KEY,JSON.stringify(rows.slice(-MAX)))}catch{}return true}
    rows.push({k:key,t:now});try{sessionStorage.setItem(KEY,JSON.stringify(rows.slice(-MAX)))}catch{}return false
  }
  async function send(source,error,context={}){
    if(!Auth.session||!navigator.onLine||API.isDemo()||shouldIgnore(error,context))return;
    const fp=fingerprint(source,error,context);if(seenRecently(fp)||sending||Date.now()-lastSentAt<3000)return;
    sending=true;lastSentAt=Date.now();try{await API.call('logClientError',{source,action:context.action||'',page:location.hash.slice(1),message:messageOf(error),stack:String(error?.stack||''),context},{skipQueue:true})}catch{}finally{sending=false}
  }
  function init(){if(initialized)return;initialized=true;window.addEventListener('error',e=>send('window.error',e.error||e.message,{file:e.filename||'',line:e.lineno||0,column:e.colno||0}));window.addEventListener('unhandledrejection',e=>send('unhandledrejection',e.reason||'Promise rejected'))}
  return {send,init};
})();

  function openForm(r={}){Utils.modal(r.id?'Edit Rapat':'Buat Agenda Rapat',form(r),`<button class="btn" data-close-modal>Batal</button><button class="btn btn-primary" id="saveMeeting">Simpan</button>`);const f=Utils.q('#meetingForm');f._draftController=FormDraft.attach(f,{entity:'meeting',recordId:r.id||'new'});Utils.q('#saveMeeting').onclick=saveForm}
  async function saveForm(){const f=Utils.q('#meetingForm');if(!f.reportValidity())return;const btn=Utils.q('#saveMeeting');if(btn.disabled)return;btn.disabled=true;const d=Utils.formData(f),old=Store.meetings.find(x=>x.id===d.id),previous=old?JSON.parse(JSON.stringify(old)):null,now=Utils.isoNow();d.id=d.id||Utils.id('RPT');d.created_by=old?.created_by||Auth.session.user.nama;d.created_at=old?.created_at||now;d.updated_at=now;d._expected_updated_at=old?.updated_at||'';const local={...d,_sync_pending:true};delete local._expected_updated_at;Store.mergeRows('meetings',[local]);Store.persistCache().catch(()=>{});f._draftController?.clear();Utils.closeModal();Utils.toast('Rapat disimpan • sinkronisasi latar','success');App.navigate('meetings',false);API.backgroundWrite('saveMeeting',{record:d},{collection:'meetings',operation:'save',route:'meetings',id:d.id,previous,label:'Simpan Rapat'})}
  function view(id){const r=Store.meetings.find(x=>x.id===id);if(!r)return;Utils.modal('Detail Rapat',documentHtml(r),`<button class="btn" data-close-modal>Tutup</button><button class="btn btn-primary" data-action="pdf-meeting" data-id="${id}">Export PDF</button>`)}

const Report = (() => {
  let selected=Utils.today();
  function summary(date=selected){const day=Utils.toDateKey(date)||Utils.today();const onPublish=b=>Utils.sameDate(b.tanggal,day),onWork=b=>Utils.sameDate(b.tanggal,day)||Utils.sameDate(b.deadline,day);const briefs=(Store.briefs||[]).filter(b=>!b.archived),allTasks=(Store.tasks||[]).filter(t=>!t.archived);const pub=briefs.filter(b=>onPublish(b)&&['Publish','Insight'].includes(b.status));const prod=briefs.filter(b=>onWork(b)&&!['Publish','Insight'].includes(b.status));const insight=briefs.filter(b=>(onPublish(b)||Utils.sameDate(b.updated_at,day))&&Number(b.insight_reach)>0);const tasks=allTasks.filter(t=>Utils.sameDate(t.deadline,day));return {day,pub,prod,insight,tasks}}
  function wa(date=selected){const s=summary(date);return `📊 *REPORT PRODUKSI KONTEN*\n\nTanggal: ${Utils.formatDate(s.day)}\n\n✅ *Publish:*\n${s.pub.map(x=>`- ${x.judul}${x.link_konten?`\n  ${x.link_konten}`:''}`).join('\n')||'-'}\n\n⚙️ *Produksi:*\n${s.prod.map(x=>`- ${x.judul} (${x.status})`).join('\n')||'-'}\n\n🧑‍💻 *Tugas Hari Ini:*\n${s.tasks.map(x=>`- ${x.petugas}: ${x.judul_tugas} (${x.status})`).join('\n')||'-'}\n\n📈 *Insight:*\n${s.insight.map(x=>`- ${x.judul}: ${Utils.num(x.insight_reach)} reach`).join('\n')||'-'}`}
  function page(){selected=Utils.toDateKey(selected)||Utils.today();const s=summary();return `<div class="section-row"><div class="section-title"><h3>Report Harian</h3><p>Ringkasan brief, publikasi, tugas, dan insight berdasarkan tanggal terpilih.</p></div><div class="actions"><button class="btn btn-soft" data-action="copy-report">💬 Copy WhatsApp</button><button class="btn" data-action="pdf-report">PDF</button><button class="btn" data-action="export-report">Excel</button></div></div><div class="card card-pad"><div class="toolbar"><label style="font-size:12px;font-weight:800">Tanggal</label><input id="reportDate" class="input" type="date" value="${selected}"><span class="badge badge-blue">${s.pub.length+s.prod.length} brief • ${s.tasks.length} tugas</span></div><div id="reportBody">${body(s)}</div></div>`}
  function body(s){return `<div class="grid grid-4"><div class="card card-pad"><h4 style="margin-top:0">✅ Publish (${s.pub.length})</h4>${s.pub.map(x=>`<div style="padding:9px 0;border-bottom:1px solid #fce7f3"><strong>${Utils.esc(x.judul)}</strong><div class="cell-sub">${x.link_konten?`<a href="${Utils.esc(x.link_konten)}" target="_blank">${Utils.esc(x.link_konten)}</a>`:'Link belum diisi'}</div></div>`).join('')||'<p class="cell-sub">Belum ada publish.</p>'}</div><div class="card card-pad"><h4 style="margin-top:0">⚙️ Produksi (${s.prod.length})</h4>${s.prod.map(x=>`<div style="padding:9px 0;border-bottom:1px solid #fce7f3"><strong>${Utils.esc(x.judul)}</strong><div class="cell-sub">${Utils.statusBadge(x.status)}</div></div>`).join('')||'<p class="cell-sub">Belum ada proses.</p>'}</div><div class="card card-pad"><h4 style="margin-top:0">🧑‍💻 Tugas (${s.tasks.length})</h4>${s.tasks.map(x=>`<div style="padding:9px 0;border-bottom:1px solid #fce7f3"><strong>${Utils.esc(x.petugas)}</strong><div class="cell-sub">${Utils.esc(x.judul_tugas)} • ${Utils.statusBadge(x.status)}</div></div>`).join('')||'<p class="cell-sub">Belum ada tugas.</p>'}</div><div class="card card-pad"><h4 style="margin-top:0">📈 Insight (${s.insight.length})</h4>${s.insight.map(x=>`<div style="padding:9px 0;border-bottom:1px solid #fce7f3"><strong>${Utils.esc(x.judul)}</strong><div class="cell-sub">${Utils.num(x.insight_reach)} reach</div></div>`).join('')||'<p class="cell-sub">Belum ada insight.</p>'}</div></div><div class="code-note" style="margin-top:18px">${Utils.esc(wa(s.day))}</div>`}
  function bind(){const input=Utils.q('#reportDate');if(input)input.onchange=e=>{selected=Utils.toDateKey(e.target.value)||Utils.today();const s=summary(selected);const bodyEl=Utils.q('#reportBody');if(bodyEl)bodyEl.innerHTML=body(s)}}
  function print(){const s=summary();Utils.printDocument('Report Harian '+s.day,`<h1 class="title">REPORT PRODUKSI KONTEN</h1><div class="date">${Utils.formatDate(s.day)}</div><div class="section"><h3>Konten Publish</h3><table><tr><th>Judul</th><th>Link</th></tr>${s.pub.map(x=>`<tr><td>${Utils.esc(x.judul)}</td><td>${Utils.esc(x.link_konten||'-')}</td></tr>`).join('')||'<tr><td colspan="2">-</td></tr>'}</table></div><div class="section"><h3>Konten Produksi</h3><table><tr><th>Judul</th><th>Status</th></tr>${s.prod.map(x=>`<tr><td>${Utils.esc(x.judul)}</td><td>${Utils.esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="2">-</td></tr>'}</table></div><div class="section"><h3>Tugas Hari Ini</h3><table><tr><th>PIC</th><th>Tugas</th><th>Status</th></tr>${s.tasks.map(x=>`<tr><td>${Utils.esc(x.petugas)}</td><td>${Utils.esc(x.judul_tugas)}</td><td>${Utils.esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="3">-</td></tr>'}</table></div><div class="section"><h3>Insight</h3><table><tr><th>Judul</th><th>Reach</th></tr>${s.insight.map(x=>`<tr><td>${Utils.esc(x.judul)}</td><td>${Utils.num(x.insight_reach)}</td></tr>`).join('')||'<tr><td colspan="2">-</td></tr>'}</table></div>`)}
  function exportExcel(){const s=summary();Utils.exportXls(`report_${s.day}.xls`,{PUBLISH:[['Judul','Link'],...s.pub.map(x=>[x.judul,x.link_konten||''])],PRODUKSI:[['Judul','Status'],...s.prod.map(x=>[x.judul,x.status])],TUGAS:[['PIC','Tugas','Status','Deadline'],...s.tasks.map(x=>[x.petugas,x.judul_tugas,x.status,Utils.toDateKey(x.deadline)])],INSIGHT:[['Judul','Reach'],...s.insight.map(x=>[x.judul,Number(x.insight_reach)||0])]})}
  return {page,bind,wa,print,exportExcel};
})();

/* ================================================================
   PWA / INSTALL MODULE
================================================================ */
const PWA = (() => {
  let deferredPrompt=null,installBanner=null,controllerReloaded=false;
  const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
  const isAndroid=()=>/android/i.test(navigator.userAgent);
  const secureContext=()=>location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname);
  const canRegister=()=>secureContext()&&'serviceWorker' in navigator;
  function status(){
    if(isStandalone())return {key:'ready',label:'Sudah terinstal',detail:'Aplikasi sedang berjalan dalam mode standalone.'};
    if(deferredPrompt)return {key:'available',label:'Siap diinstal',detail:'Browser mendukung instalasi langsung.'};
    if(location.protocol==='file:')return {key:'limited',label:'Perlu hosting HTTPS',detail:'File lokal dapat dibuka, tetapi instalasi PWA memerlukan URL HTTPS.'};
    if(!secureContext())return {key:'limited',label:'Koneksi belum aman',detail:'Gunakan HTTPS agar service worker dan instalasi aktif.'};
    if(isIOS())return {key:'available',label:'Tambahkan ke Layar Utama',detail:'Gunakan menu Bagikan pada Safari.'};
    return {key:'available',label:'Shortcut tersedia',detail:'Gunakan tombol instal atau menu browser.'};
  }
  function statusHtml(){const s=status();return `<span class="pwa-status ${s.key}">${s.key==='ready'?'✓':s.key==='limited'?'!':'📲'} ${Utils.esc(s.label)}</span><div class="cell-sub" style="margin-top:8px">${Utils.esc(s.detail)}</div>`}
  function createBanner(){
    if(installBanner||isStandalone())return;
    installBanner=document.createElement('div');installBanner.id='pwaInstallBanner';installBanner.className='pwa-install-banner hidden';

const HtmlDocumentModule = (() => {
  const MAX_FILE_BYTES=5*1024*1024;
  const canManage=()=>Auth.can(Config.roles.SUPERADMIN,Config.roles.ANALIS);
  let pendingFile=null,previewUrl='',viewState={page:1,limit:12,search:''};
  const fileSize=v=>{const n=Number(v)||0;if(!n)return '-';if(n<1024)return `${n} B`;if(n<1024*1024)return `${(n/1024).toFixed(1)} KB`;return `${(n/1024/1024).toFixed(2)} MB`};
  const revokePreview=()=>{if(previewUrl){try{URL.revokeObjectURL(previewUrl)}catch{}previewUrl=''}};
  const bytesToBase64=bytes=>{let out='',step=0x8000;for(let i=0;i<bytes.length;i+=step)out+=String.fromCharCode(...bytes.subarray(i,Math.min(i+step,bytes.length)));return btoa(out)};
  const base64ToBytes=value=>{const raw=atob(String(value||'')),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out};
  async function sha256Hex(buffer){if(!crypto?.subtle)return '';const hash=await crypto.subtle.digest('SHA-256',buffer);return [...new Uint8Array(hash)].map(v=>v.toString(16).padStart(2,'0')).join('')}
  async function packHtml(buffer){
    const raw=new Uint8Array(buffer);
    if(typeof CompressionStream==='undefined')return {encoding:'plain-base64',html_base64:bytesToBase64(raw),compressed_size:raw.byteLength};
    const stream=new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'));
    const packed=new Uint8Array(await new Response(stream).arrayBuffer());
    return {encoding:'gzip-base64',html_gzip_base64:bytesToBase64(packed),compressed_size:packed.byteLength};
  }
  async function unpackHtml(data){
    if(data?.content_encoding==='gzip-base64'&&data?.html_gzip_base64){
      if(typeof DecompressionStream==='undefined')throw new Error('Browser belum mendukung pembukaan dokumen terkompresi. Gunakan Chrome terbaru.');
      const stream=new Blob([base64ToBytes(data.html_gzip_base64)]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    if(data?.content_encoding==='plain-base64'&&data?.html_base64)return base64ToBytes(data.html_base64);
    return new TextEncoder().encode(String(data?.html_content||''));
  }
  function docsFiltered(){const q=String(viewState.search||'').toLowerCase();return [...(Store.htmlDocuments||[])].filter(d=>!q||[d.judul,d.nama_file,d.created_by,d.tanggal].join(' ').toLowerCase().includes(q)).sort((a,b)=>String(b.created_at||b.tanggal).localeCompare(String(a.created_at||a.tanggal)))}

  function resultHtml(){const docs=docsFiltered(),pages=Math.max(1,Math.ceil(docs.length/viewState.limit));viewState.page=Math.min(Math.max(1,viewState.page),pages);const rows=docs.slice((viewState.page-1)*viewState.limit,viewState.page*viewState.limit),nums=[];for(let p=Math.max(1,viewState.page-2);p<=Math.min(pages,viewState.page+2);p++)nums.push(`<button class="btn btn-sm ${p===viewState.page?'active':''}" data-html-page="${p}">${p}</button>`);const empty=!Store.lazyLoaded.htmlDocuments?'<div class="card card-pad" style="grid-column:1/-1"><div class="skeleton" style="height:120px"></div><p class="cell-sub">Memuat metadata HTML di latar...</p></div>':'<div class="card empty" style="grid-column:1/-1"><div class="empty-icon">⌘</div>Belum ada dokumen HTML yang sesuai.</div>';return `<div class="html-doc-grid">${rows.map(card).join('')||empty}</div><div class="pagination-bar"><span class="pagination-info">${Utils.num(docs.length)} dokumen • Halaman ${viewState.page} dari ${pages}</span>${pages>1?`<div class="pagination-controls"><button class="btn btn-sm" data-html-page="${Math.max(1,viewState.page-1)}" ${viewState.page<=1?'disabled':''}>‹</button>${nums.join('')}<button class="btn btn-sm" data-html-page="${Math.min(pages,viewState.page+1)}" ${viewState.page>=pages?'disabled':''}>›</button></div>`:''}</div>`}
  function page(){Store.hydrateModuleCache?.('htmlDocuments');return `<div class="section-row"><div class="section-title"><h3>Dokumen HTML Analis</h3><p>Metadata tampil dari cache; daftar dibatasi per halaman agar tetap ringan.</p></div>${canManage()?'<button class="btn btn-primary" data-action="new-html-document">＋ Upload HTML</button>':''}</div><div class="login-note" style="margin-bottom:16px">File HTML dikompresi di browser sebelum dikirim ke Google Drive. Spreadsheet hanya menyimpan metadata. Maksimal <strong>5 MB sebelum kompresi</strong>.</div><div class="card card-pad"><div class="toolbar"><input id="htmlDocumentSearch" class="input search-small" placeholder="Cari judul, nama file, atau pembuat..." value="${Utils.esc(viewState.search)}"><select id="htmlDocumentLimit" class="select"><option value="12" ${viewState.limit===12?'selected':''}>12 / halaman</option><option value="24" ${viewState.limit===24?'selected':''}>24 / halaman</option><option value="48" ${viewState.limit===48?'selected':''}>48 / halaman</option></select><button class="btn" id="htmlDocumentReset" type="button">Reset</button><span class="module-cache-note">⚡ Cache-first</span></div><div id="htmlDocumentResults">${resultHtml()}</div></div>`}

const InsightExtension = (() => {
  const pending=new Map();let extensionAvailable=false,lastVersion='';
  const desktop=()=>window.matchMedia('(min-width: 861px)').matches&&!/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
  window.addEventListener('message',event=>{const d=event.data;if(!d||d.source!=='MEDIA_WADUL_GUSE_EXTENSION'||!d.requestId)return;const item=pending.get(d.requestId);if(!item)return;pending.delete(d.requestId);clearTimeout(item.timer);if(d.ok){extensionAvailable=true;lastVersion=d.version||lastVersion;item.resolve(d.data||d)}else item.reject(new Error(d.error||'Extension gagal membaca halaman.'))});
  function request(type,payload={},timeout=45000){return new Promise((resolve,reject)=>{if(!desktop())return reject(new Error('Pembacaan otomatis hanya tersedia pada Chrome desktop. Tampilan data dan input manual tetap dapat digunakan.'));const requestId=Utils.id('EXT');const timer=setTimeout(()=>{pending.delete(requestId);reject(new Error('Extension tidak merespons. Pastikan Insight Reader v1.7.0 terpasang dan aktif.'))},timeout);pending.set(requestId,{resolve,reject,timer});window.postMessage({source:'MEDIA_WADUL_GUSE_APP',type,requestId,payload},'*')})}
  async function ping(){try{const r=await request('PING',{},3500);extensionAvailable=true;lastVersion=r.version||lastVersion;return {available:true,version:lastVersion,capabilities:r.capabilities||[]}}catch{return {available:false,version:'',capabilities:[]}}}
  async function scanUrl(url,context={}){const out=await request('SCAN_URL',{url,context},80000);if(out.status==='login_required')throw new Error('LOGIN_REQUIRED|Silakan login ke '+(out.platform||'platform')+' pada Chrome, lalu ulangi.');if(out.status!=='ok'&&out.status!=='partial')throw new Error(out.message||'Insight tidak dapat dibaca.');return out}
  async function scanComments(url,context={}){const out=await request('SCAN_COMMENTS',{url,context},80000);if(out.status==='login_required')throw new Error('LOGIN_REQUIRED|Silakan login ke '+(out.platform||'platform')+' pada Chrome, lalu ulangi.');if(out.status!=='ok'&&out.status!=='partial')throw new Error(out.message||'Komentar tidak dapat dibaca.');return out}
  async function diagnostic(url,context={}){return request('DIAGNOSTIC',{url,context},80000)}
  return {isDesktop:desktop,ping,scanUrl,scanComments,diagnostic,get available(){return extensionAvailable},get version(){return lastVersion}};
})();

  function bindWorkspace(){

/* ================================================================
   THEME MODULE — LIGHT / DARK / SYSTEM
================================================================ */
const Theme = (() => {
  const KEY='mwg_theme_mode',MODES=['system','light','dark'];
  const media=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  const mode=()=>localStorage.getItem(KEY)||'system';
  const resolved=m=>m==='dark'||(m==='system'&&media?.matches)?'dark':'light';
  function apply(next=mode(),persist=true){if(!MODES.includes(next))next='system';if(persist)localStorage.setItem(KEY,next);const active=resolved(next);document.documentElement.dataset.theme=active;document.documentElement.dataset.themeMode=next;document.documentElement.style.colorScheme=active;const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=active==='dark'?'#0b0e14':'#4a1028';syncButtons();return next}
  function icon(){const m=mode();return m==='dark'?'☾':m==='light'?'☀':'◐'}
  function label(){return {system:'Ikuti Perangkat',light:'Terang',dark:'Gelap'}[mode()]||'Tema'}
  function cycle(){const m=mode(),next=m==='system'?'light':m==='light'?'dark':'system';apply(next);Utils.toast('Tema: '+label(),'success')}
  function syncButtons(){document.querySelectorAll('[data-theme-icon]').forEach(x=>x.textContent=icon());document.querySelectorAll('[data-theme-mode]').forEach(x=>{const active=x.dataset.themeMode===mode();x.classList.toggle('active',active);x.setAttribute('aria-pressed',String(active))});document.querySelectorAll('[data-theme-active-label]').forEach(x=>x.textContent=label())}

  function openMobileNav(){Utils.q('.sidebar')?.classList.add('mobile-open');Utils.q('.mobile-nav-overlay')?.classList.add('open');document.body.style.overflow='hidden'}
  function closeMobileNav(){Utils.q('.sidebar')?.classList.remove('mobile-open');Utils.q('.mobile-nav-overlay')?.classList.remove('open');document.body.style.overflow=''}
  function renderShell(){const u=Auth.session.user;Utils.q('#app').innerHTML=`<div class="app-shell"><aside class="sidebar"><button class="mobile-nav-close" type="button" data-action="mobile-nav-close" aria-label="Tutup menu">✕</button><div class="brand"><div class="brand-mark"><img src="${APP_LOGO_DATA}" alt="Logo MEDIA WG"></div><div><h1>${Utils.esc(Config.data.appName)}</h1><p>Manajemen Konten</p></div></div><div class="nav-section">Workspace</div><nav>${navItems().map(([r,i,l])=>`<button class="nav-item" data-route="${r}"><span class="nav-icon">${i}</span>${l}</button>`).join('')}</nav>${Auth.can(Config.roles.SUPERADMIN)?`<div class="nav-section">Administrasi</div><nav><button class="nav-item" data-route="templates"><span class="nav-icon">▤</span>Template</button><button class="nav-item" data-route="accounts"><span class="nav-icon">👥</span>Akun</button><button class="nav-item" data-route="health"><span class="nav-icon">🩺</span>Kesehatan Sistem</button><button class="nav-item" data-route="settings"><span class="nav-icon">⚙</span>Pengaturan</button></nav>`:''}<div class="sidebar-footer"><div class="user-mini"><div class="avatar">${Utils.initials(u.nama)}</div><div><strong>${Utils.esc(u.nama)}</strong><span>${Utils.esc(u.role)}</span></div></div><button class="nav-item" style="margin-top:12px" data-action="logout"><span class="nav-icon">↪</span>Keluar</button><div class="app-version">v${APP_VERSION} • Build ${APP_BUILD}</div></div></aside><div class="mobile-nav-overlay" data-action="mobile-nav-close"></div><main class="main"><header class="topbar"><button class="icon-btn mobile-menu-btn" type="button" data-action="mobile-nav-open" aria-label="Buka menu navigasi">☰</button><div class="page-heading"><h2 id="pageTitle">Dashboard</h2><p id="pageSub">Ringkasan produksi konten</p></div><div class="global-search"><span class="search-ico">⌕</span><input id="globalSearch" placeholder="Cari brief, tugas, footage, hot issue, rapat..."><div id="searchResults" class="search-results hidden"></div></div><div class="top-actions"><button class="icon-btn" type="button" data-action="theme-cycle" title="Ganti tema" aria-label="Ganti tema"><span class="theme-icon" data-theme-icon>${Theme.icon()}</span></button><button class="icon-btn pwa-install-icon browser-only" type="button" data-pwa-install title="Instal aplikasi" aria-label="Instal aplikasi">📲</button><button class="icon-btn" data-action="profile">${Utils.initials(u.nama)}</button><div id="globalSyncIndicator" class="sync-indicator syncing" title="Menyiapkan sinkronisasi"><span class="sync-dot"></span><span class="sync-label">Menyiapkan sinkronisasi</span><span class="sync-short">…</span></div></div></header><section class="content" id="pageContent"><div class="skeleton" style="height:140px"></div></section></main><button class="fab" data-action="context-add">＋</button><nav class="bottom-nav">${navItems().slice(0,5).map(([r,i,l])=>`<button data-route="${r}"><span>${i}</span>${l}</button>`).join('')}</nav></div>`;bindGlobal();updateNotif()}
  async function reload(route=current,force=false){try{await Store.load({force});updateNotif();navigate(route,false)}catch(e){Utils.toast(e.message,'error');Utils.q('#pageContent').innerHTML=`<div class="card empty"><div class="empty-icon">⚠️</div><strong>Gagal memuat data</strong><p>${Utils.esc(e.message)}</p></div>`}}
  function navigate(route,push=true){
    closeMobileNav();if(!routes[route])route='dashboard';
    const allowed=navItems().map(x=>x[0]).concat(Auth.can(Config.roles.SUPERADMIN)?['accounts','templates','activity','health','settings']:[]);
    if(!allowed.includes(route))route=allowed[0];current=route;if(push)history.replaceState(null,'','#'+route);
    BackgroundSyncManager.boostRoute(route);
    Utils.qa('[data-route]').forEach(x=>x.classList.toggle('active',x.dataset.route===route));
    Utils.q('#pageTitle').textContent=routes[route].title;Utils.q('#pageSub').textContent=routes[route].sub;
    let html='';switch(route){case'dashboard':html=Dashboard.page();break;case'briefs':html=BriefModule.page();break;case'tasks':html=TaskModule.page();break;case'kanban':html=Kanban.page();break;case'calendar':html=CalendarModule.page();break;case'hotissues':html=HotIssue.page();break;case'meetings':html=Meeting.page();break;case'reports':html=Report.page();break;case'htmlfiles':html=HtmlDocumentModule.page();break;case'footages':html=FootageModule.page();break;case'insights':html=InsightTracker.page();break;case'aistudio':html=AIStudio.page();break;case'accounts':html=AdminModule.accountsPage();break;case'templates':html=AdminModule.templatesPage();break;case'activity':html=AdminModule.activityPage();break;case'health':html=SystemHealthModule.page();break;case'settings':html=Settings.page();break}
    Utils.q('#pageContent').innerHTML=html;afterRender(route,false)
  }
  function ensureLazyRoute(route){BackgroundSyncManager.boostRoute(route)}
  function afterRender(route,waiting=false){
    ensureLazyRoute(route);if(waiting)return;
    if(route==='dashboard')Dashboard.bind();if(route==='briefs')BriefModule.bindFilters();if(route==='tasks')TaskModule.bindFilters();if(route==='kanban')Kanban.bind();if(route==='calendar')CalendarModule.bind();if(route==='hotissues')HotIssue.bind();if(route==='reports')Report.bind();if(route==='htmlfiles')HtmlDocumentModule.bind();if(route==='footages')FootageModule.init();if(route==='insights')InsightTracker.init();if(route==='aistudio')AIStudio.init();if(route==='health')SystemHealthModule.init();if(route==='settings')Settings.bind()
  }
  function scheduleRouteRefresh(route=current,delay=45){clearTimeout(routeRefreshTimer);const expected=route;routeRefreshTimer=setTimeout(()=>{if(Auth.session&&current===expected&&BackgroundSyncManager.routeReady(expected))navigate(expected,false)},delay)}
  function bindGlobal(){if(!globalEventsBound){
    document.addEventListener('click',handleAction);
    window.addEventListener('mwg:sync-module',e=>{const id=e.detail?.id;if(!id)return;BackgroundSyncManager.renderIndicator();const deps={dashboard:['briefs','tasks','dashboard','hotIssues'],briefs:['briefs'],tasks:['tasks'],kanban:['briefs','tasks','kanban'],calendar:['briefs','tasks','calendar'],hotissues:['hotIssues'],meetings:['meetings'],reports:['reporting'],htmlfiles:['htmlDocuments'],footages:['footages'],insights:['insights'],aistudio:['aistudio'],accounts:['accounts'],templates:['templates'],health:['health'],settings:['health','aistudio']};if((deps[current]||[]).includes(id))scheduleRouteRefresh(current)});
    window.addEventListener('mwg:sync-state',()=>BackgroundSyncManager.renderIndicator());
    window.addEventListener('mwg:references-ready',()=>{if(['briefs','tasks','kanban','calendar'].includes(current))scheduleRouteRefresh(current,60)});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Auth.session){const age=Date.now()-new Date(Store.lastSyncAt||0).getTime();if(age>120000)BackgroundSyncManager.refreshAll().catch(()=>{})}});
    globalEventsBound=true
  }
  Utils.qa('[data-route]').forEach(b=>b.onclick=()=>navigate(b.dataset.route));const gs=Utils.q('#globalSearch');if(gs){gs.oninput=Utils.debounce(()=>globalSearch(gs.value),180);gs.onblur=()=>setTimeout(()=>Utils.q('#searchResults')?.classList.add('hidden'),180)}window.onresize=Utils.debounce(()=>{if(current==='dashboard')Dashboard.renderCharts()},200);BackgroundSyncManager.renderIndicator()}
  async function handleAction(e){const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;switch(a){case'theme-cycle':Theme.cycle();break;case'mobile-nav-open':openMobileNav();break;case'mobile-nav-close':closeMobileNav();break;case'logout':stopNotificationPolling();Auth.logout();break;case'new-brief':await BriefModule.openForm();break;case'edit-brief':await BriefModule.openById(id);break;case'view-brief':BriefModule.view(id);break;case'copy-brief':{const b=await BriefModule.ensureFull(id);if(b)Utils.copy(BriefModule.waText(b));break}case'send-brief-wa':BriefModule.sendWhatsApp(id,el.dataset.person);break;case'pdf-dashboard':Dashboard.print();break;case'pdf-brief':{const b=await BriefModule.ensureFull(id);if(b)BriefModule.printBrief(b);break}case'archive-brief':BriefModule.archive(id,el.dataset.archived==='true');break;case'delete-brief':BriefModule.del(id);break;case'export-brief':BriefModule.exportExcel();break;case'new-task':await TaskModule.openForm();break;case'view-task':TaskModule.view(id);break;case'edit-task':await TaskModule.openById(id);break;case'copy-task':{const t=await TaskModule.ensureFull(id);if(t)Utils.copy(TaskModule.waText(t));break}case'archive-task':TaskModule.archive(id,el.dataset.archived==='true');break;case'delete-task':TaskModule.del(id);break;case'export-task':TaskModule.exportExcel();break;case'new-hot':HotIssue.openForm();break;case'view-hot':await HotIssue.view(id);break;case'analyze-hot':await HotIssue.analyzeExisting(id);break;case'ai-draft-hot':{await HotIssue.ensureFull(id);AIStudio.openWithContext('draft',id);}break;case'ai-review-brief':AIStudio.openWithContext('review',id);break;case'ai-narrative-brief':AIStudio.openWithContext('insight',id);break;case'edit-hot':await HotIssue.openById(id);break;case'delete-hot':HotIssue.del(id);break;case'open-link':if(el.dataset.url)window.open(el.dataset.url,'_blank');break;case'new-meeting':Meeting.openForm();break;case'edit-meeting':Meeting.openForm(Store.meetings.find(x=>x.id===id));break;case'view-meeting':Meeting.view(id);break;case'pdf-meeting':{const r=Store.meetings.find(x=>x.id===id);if(r)Meeting.print(r);break}case'delete-meeting':Meeting.del(id);break;case'copy-report':Utils.copy(Report.wa());break;case'pdf-report':Report.print();break;case'export-report':Report.exportExcel();break;case'new-account':AdminModule.accountForm();break;case'edit-account':AdminModule.accountForm(Store.accounts.find(x=>x.id===id));break;case'delete-account':AdminModule.deleteAccount(id);break;case'new-template':AdminModule.templateForm();break;case'edit-template':AdminModule.templateForm(Store.templates.find(x=>x.id===id));break;case'delete-template':AdminModule.deleteTemplate(id);break;case'new-html-document':HtmlDocumentModule.openForm();break;case'view-html-document':HtmlDocumentModule.view(id);break;case'delete-html-document':HtmlDocumentModule.del(id);break;case'new-footage':FootageModule.openForm();break;case'edit-footage':FootageModule.openForm(FootageModule.get(id)||{});break;case'copy-footage-link':{const f=FootageModule.get(id);if(f)Utils.copy(f.link_gdrive||'');break}case'delete-footage':FootageModule.del(id);break;case'retry-footage-sync':FootageModule.retry(id);break;case'update-insight-link':InsightTracker.updateLink(id);break;case'update-all-insights':InsightTracker.updateAll();break;case'test-insight-extension':InsightTracker.testExtension();break;case'export-insight-audit':InsightTracker.exportAudit();break;case'manual-insight-link':InsightTracker.manualInput(id);break;case'capture-comments':InsightTracker.captureComments(id);break;case'view-comment-intelligence':InsightTracker.viewCommentIntelligence(id);break;case'profile':profile();break;case'context-add':contextAdd();break;case'test-api':try{const h=await API.probeHealth();Store.apiInfo=h;Utils.toast(`${h.message||'Koneksi berhasil'} • GS v${h.version||'-'}`,'success');if(current==='settings')navigate('settings',false)}catch(err){Utils.toast(err.message,'error')}break;case'reset-demo':if(confirm('Reset seluruh data demo?')){LocalDB.reset();await reload(current);Utils.toast('Data demo direset','success')}break}}
  async function globalSearch(term){const box=Utils.q('#searchResults');term=String(term||'').trim();if(!box)return;if(term.length<2){box.classList.add('hidden');box.innerHTML='';return}const q=term.toLowerCase(),rows=[];(Store.briefs||[]).some(b=>{if([b.id,b.judul,b.konten_pilar,b.kategori_konten].join(' ').toLowerCase().includes(q))rows.push({type:'brief',id:b.id,title:b.judul||b.id,meta:[b.konten_pilar,b.status].filter(Boolean).join(' • ')});return rows.length>=8});if(rows.length<12)(Store.tasks||[]).some(t=>{if([t.id,t.judul_tugas,t.petugas,t.jobdesk,t.status].join(' ').toLowerCase().includes(q))rows.push({type:'task',id:t.id,title:t.judul_tugas||t.id,meta:[t.petugas,t.status].filter(Boolean).join(' • ')});return rows.length>=12});box.innerHTML=rows.map(x=>`<div class="search-result" data-search-type="${Utils.esc(x.type)}" data-search-id="${Utils.esc(x.id)}"><strong>${Utils.esc(x.title||x.id)}</strong><span>${Utils.esc(x.meta||'')}</span></div>`).join('')||'<div class="empty" style="padding:20px">Tidak ditemukan pada cache lokal</div>';box.classList.remove('hidden');Utils.qa('[data-search-id]',box).forEach(r=>r.onclick=async()=>{box.classList.add('hidden');if(r.dataset.searchType==='brief')BriefModule.view(r.dataset.searchId);else if(r.dataset.searchType==='task')TaskModule.view(r.dataset.searchId)})}
  function updateNotif(){}
  function startNotificationPolling(){}
  function stopNotificationPolling(){}

  function profile(){const u=Auth.session.user;Utils.modal('Profil Pengguna',`<div class="profile-hero"><div class="avatar">${Utils.initials(u.nama)}</div><div><h2 style="margin:0">${Utils.esc(u.nama)}</h2><p class="cell-sub">${Utils.esc(u.username)} • ${Utils.esc(u.role)}</p></div></div><div class="login-note" style="margin-top:20px">Hak akses tampilan dan aksi mengikuti role pada sheet AKUN.</div>`,`<button class="btn" data-close-modal>Tutup</button><button class="btn btn-danger" data-action="logout">Keluar</button>`,'small')}
  function contextAdd(){if(current==='briefs'&&Auth.can(Config.roles.SUPERADMIN))BriefModule.openForm();else if(current==='tasks'&&Auth.can(Config.roles.SUPERADMIN,Config.roles.STAF,Config.roles.ANALIS))TaskModule.openForm();else if(current==='hotissues'&&Auth.can(Config.roles.SUPERADMIN,Config.roles.ANALIS))HotIssue.openForm();else if(current==='meetings'&&Auth.can(Config.roles.SUPERADMIN))Meeting.openForm();else if(current==='htmlfiles'&&Auth.can(Config.roles.SUPERADMIN,Config.roles.ANALIS))HtmlDocumentModule.openForm();else if(current==='footages'&&Auth.can(Config.roles.SUPERADMIN,Config.roles.STAF,Config.roles.ANALIS))FootageModule.openForm();else Utils.toast('Tidak ada aksi tambah pada halaman ini')}
  async function publicCalendar(){document.body.classList.add('public-mode');Utils.q('#app').innerHTML=`<main class="public-calendar-page"><header class="topbar public-topbar"><div class="public-brand"><div class="brand-mark"><img src="${APP_LOGO_DATA}" alt="Logo MEDIA WG"></div><div><strong>${Utils.esc(Config.data.appName)}</strong><span>${Utils.esc(Config.data.organization)}</span></div></div><div class="page-heading"><h2>Kalender</h2><p>Jadwal brief dan tugas</p></div><div class="top-actions"><button class="icon-btn" type="button" data-action="theme-cycle" title="Ganti tema"><span data-theme-icon>${Theme.icon()}</span></button><button class="btn btn-soft browser-only" type="button" data-pwa-install>📲 Instal App</button><span class="badge badge-blue">Publik • v${APP_VERSION}</span><a class="btn btn-primary" href="${location.href.split('#')[0]}">Login CMS</a></div></header><section class="content"><div id="publicCalendarWrap"><div class="card card-pad"><div class="skeleton" style="height:400px"></div></div></div></section></main>`;const publicTheme=Utils.q('[data-action="theme-cycle"]');if(publicTheme)publicTheme.onclick=Theme.cycle;try{const data=await API.call('publicCalendar');Store.briefs=data;Store.tasks=[];Utils.q('#publicCalendarWrap').innerHTML=CalendarModule.page(true);CalendarModule.bind()}catch(e){Utils.q('#publicCalendarWrap').innerHTML=`<div class="card empty"><div class="empty-icon">⚠️</div><strong>Kalender publik gagal dimuat</strong><p>${Utils.esc(e.message)}</p></div>`}}
  window.addEventListener('hashchange',()=>{if(location.hash==='#public')publicCalendar();else if(Auth.session){if(!Utils.q('.app-shell'))renderShell();const r=location.hash.slice(1);reload(routes[r]?r:'dashboard')}else renderLogin()});
  return {init,renderLogin,reload,navigate};
})();

document.addEventListener('DOMContentLoaded',()=>{
  // v1.20.1: boot tidak boleh menunggu config.json. URL fallback sudah tertanam di HTML.
  // Config pusat dimuat paralel dan dibatasi timeout agar halaman tidak pernah putih kosong.
  try{PWA.init()}catch(e){console.warn('PWA init:',e)}
  try{OfflineQueue.init()}catch(e){console.warn('OfflineQueue init:',e)}
  try{API.initFastSync?.();API.initSimpleCrudSync?.()}catch(e){console.warn('API init:',e)}
  Promise.resolve(App.init()).catch(err=>{
    console.error('Boot CMS gagal:',err);
    const root=document.getElementById('app');
    if(root)root.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb;font-family:system-ui"><div style="max-width:520px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:24px"><strong style="display:block;font-size:18px;color:#4a1028;margin-bottom:8px">Aplikasi gagal memulai</strong><div style="font-size:13px;color:#64748b;line-height:1.6">Muat ulang halaman. Jika masih terjadi, buka Pengaturan setelah aplikasi pulih dan periksa koneksi.</div></div></div>';
  });
  Config.loadRemote().then(out=>{
    if(!out?.ok)console.warn('Config pusat tidak tersedia, memakai fallback:',out?.error||'');
  }).catch(()=>{});
});
