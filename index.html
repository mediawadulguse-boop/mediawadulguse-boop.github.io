const Utils = (() => {
  const q=(s,p=document)=>p.querySelector(s), qa=(s,p=document)=>[...p.querySelectorAll(s)];
  const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const id=(prefix='ID')=>`${prefix}-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).slice(2,7).toUpperCase()}`;
  const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const toDateKey=v=>{
    if(v===null||v===undefined||v==='')return '';
    if(v instanceof Date)return isNaN(v)?'':dateKey(v);
    if(typeof v==='number'&&Number.isFinite(v)){
      if(v>1e11){const d=new Date(v);return isNaN(d)?'':dateKey(d)}
      if(v>1e9){const d=new Date(v*1000);return isNaN(d)?'':dateKey(d)}
      if(v>20000&&v<100000){const d=new Date(Date.UTC(1899,11,30)+v*86400000);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}
    }
    const s=String(v).trim();
    let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    const d=new Date(s);return isNaN(d)?'':dateKey(d)
  };
  const sameDate=(v,key)=>toDateKey(v)===toDateKey(key);
  const today=()=>dateKey();
  const isoNow=()=>new Date().toISOString();
  const formatDate=(v,opt={day:'2-digit',month:'short',year:'numeric'})=>{const k=toDateKey(v);if(!k)return v?String(v):'-';const d=new Date(k+'T00:00:00');return d.toLocaleDateString('id-ID',opt)};
  const formatDateTime=v=>{if(!v)return '-';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})};
  const num=v=>new Intl.NumberFormat('id-ID').format(Number(v)||0);
  const parseJSON=(v,fallback=[])=>{if(Array.isArray(v)||typeof v==='object'&&v!==null)return v;let cur=v;for(let i=0;i<3&&typeof cur==='string';i++){const text=cur.trim();if(!text)return fallback;try{cur=JSON.parse(text)}catch{return fallback}}return Array.isArray(cur)||typeof cur==='object'&&cur!==null?cur:fallback};
  const initials=n=>String(n||'U').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
  const debounce=(fn,wait=250)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),wait)}};
  const idle=(fn,timeout=120)=>{if('requestIdleCallback' in window)return requestIdleCallback(()=>fn(),{timeout});return setTimeout(fn,0)};
  const toast=(msg,type='')=>{const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=msg;q('#toastRoot').appendChild(el);setTimeout(()=>el.remove(),3200)};
  const statusBadge=s=>{const c=/publish|selesai|approved|insight/i.test(s)?'green':/review|planning|proses/i.test(s)?'blue':/revisi|urgent/i.test(s)?'red':/produksi/i.test(s)?'orange':'gray';return `<span class="badge badge-${c}">${esc(s||'-')}</span>`};
  const download=(name,content,type='text/plain;charset=utf-8')=>{const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},100)};
  const copy=async text=>{try{await navigator.clipboard.writeText(text);toast('Berhasil disalin','success')}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Berhasil disalin','success')}};
  const modal=(title,body,foot='',size='')=>{q('#modalRoot').innerHTML=`<div class="modal-overlay"><div class="modal ${size}"><div class="modal-head"><h3>${esc(title)}</h3><button class="close-btn" data-close-modal>✕</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`;qa('[data-close-modal]').forEach(x=>x.onclick=closeModal);q('.modal-overlay').addEventListener('click',e=>{if(e.target.classList.contains('modal-overlay'))closeModal()})};
  const closeModal=()=>q('#modalRoot').innerHTML='';
  const printDocument=(title,html)=>{const w=window.open('','_blank','width=900,height=800');if(!w){toast('Pop-up diblokir browser','error');return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Arial,sans-serif;color:#111827;margin:0}.page{padding:38px 48px}.header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #be185d;padding-bottom:14px}.logo{width:58px;height:58px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden;border:1px solid #e5e7eb}.logo img{width:100%;height:100%;object-fit:contain}.org{font-size:12px;color:#64748b}.title{font-size:24px;margin:24px 0 5px}.date{font-size:12px;color:#64748b;margin-bottom:24px}.section{margin:18px 0}.section h3{font-size:13px;text-transform:uppercase;color:#be185d;border-bottom:1px solid #e5e7eb;padding-bottom:6px}.section p,.section li,.section td{font-size:12px;line-height:1.65}.section table{width:100%;border-collapse:collapse}.section th,.section td{border:1px solid #e5e7eb;padding:8px;text-align:left}.footer{margin-top:40px;border-top:1px solid #e5e7eb;padding-top:10px;font-size:10px;color:#f9a8d4;text-align:center}@media print{@page{size:A4;margin:0}.no-print{display:none}}</style></head><body><div class="page"><div class="header"><div><strong>${esc(Config.data.organization)}</strong><div class="org">Content Management System</div></div><div class="logo"><img src="${APP_LOGO_DATA}" alt="Logo MEDIA WG"></div></div>${html}<div class="footer">Dokumen dibuat melalui ${esc(Config.data.appName)} • ${new Date().toLocaleString('id-ID')}</div></div><script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);w.document.close()};
  const xmlEsc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const exportXls=(name,sheets)=>{let worksheets='';Object.entries(sheets).forEach(([sheetName,rows])=>{worksheets+=`<Worksheet ss:Name="${xmlEsc(sheetName.slice(0,31))}"><Table>`+rows.map(r=>'<Row>'+r.map(c=>`<Cell><Data ss:Type="${typeof c==='number'?'Number':'String'}">${xmlEsc(c)}</Data></Cell>`).join('')+'</Row>').join('')+'</Table></Worksheet>'});const xml=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${worksheets}</Workbook>`;download(name,xml,'application/vnd.ms-excel')};
  const formData=form=>Object.fromEntries(new FormData(form).entries());
  const beginSubmit=(button,message='Apakah data sudah benar dan siap disimpan? Klik OK satu kali saja untuk mencegah data ganda.',busyText='Menyimpan...')=>{
    if(!button)return null;
    if(button.dataset.submitting==='1'){toast('Data sedang diproses. Mohon tunggu hingga selesai.','error');return null}
    if(!window.confirm(message))return null;
    const original=button.innerHTML;
    button.dataset.submitting='1';button.disabled=true;button.innerHTML=`⏳ ${esc(busyText)}`;
    return ()=>{if(button.isConnected){button.disabled=false;button.innerHTML=original;delete button.dataset.submitting}}
  };
  return {q,qa,esc,id,today,dateKey,toDateKey,sameDate,isoNow,formatDate,formatDateTime,num,parseJSON,initials,debounce,idle,toast,statusBadge,download,copy,modal,closeModal,printDocument,exportXls,formData,beginSubmit};
})();

  };

    const btn=e.target.closest('button[id]');if(!btn)return;const cfg=configs[btn.id];if(!cfg)return;

  },true);

const Permissions = (() => {
  const PRESETS={
    SUPERADMIN:['*'],
    ANALIS:['dashboard.view','brief.view','brief.create','brief.edit','task.view_own','task.create','task.edit_own','calendar.view','calendar.create','hotissue.view','hotissue.create','hotissue.edit','meeting.view','report.view','report.export','html.view','html.manage','footage.view','footage.create','footage.edit','insight.view','insight.manage','ai.use','listening.view','listening.convert','template.view'],
    STAF:['dashboard.view','task.view_own','task.create','task.edit_own','calendar.view','report.view','footage.view','footage.create','footage.edit','insight.view','listening.view']
  };
  const MODULES=[
    ['dashboard','Dashboard',['view']],
    ['brief','Brief',['view','create','edit','archive']],
    ['task','Tugas',['view_own','view_all','create','edit_own','edit_all','archive']],
    ['calendar','Kalender',['view','create','edit','archive']],
    ['hotissue','Hot Issue',['view','create','edit','archive']],
    ['meeting','Rapat',['view','create','edit']],
    ['report','Reporting',['view','export']],
    ['html','HTML Analis',['view','manage']],
    ['footage','Footage',['view','create','edit','delete']],
    ['insight','Insight Tracker',['view','manage']],
    ['ai','Wadul AI Studio',['use','manage']],
    ['listening','Social Listening',['view','convert','manage']],
    ['template','Template Brief',['view','manage']],
    ['activity','Activity Log',['view']],
    ['account','Akun',['view','manage_permissions']],
    ['health','Kesehatan Sistem',['view','repair']],
    ['backup','Backup',['manage']],
    ['settings','Pengaturan',['view','edit']]
  ];
  const preset=role=>new Set(PRESETS[String(role||'STAF').toUpperCase()]||[]);
  const normalize=arr=>Array.isArray(arr)?arr.map(String).filter(Boolean):[];
  function effective(user){
    if(!user)return new Set();
    const own=normalize(user.permissions);
    if(own.includes('*'))return new Set(['*']);
    if(user.permissions_override===true)return new Set(own);
    if(own.length)return new Set(own);
    return preset(user.role);
  }
  function has(user,perm){
    const set=effective(user); return set.has('*')||set.has(perm);
  }
  function labelKey(m,a){return `${m}.${a}`}
  return {PRESETS,MODULES,preset,normalize,effective,has,labelKey};
})();

/* ================================================================
   REFERENCE MANAGER — v1.21.0 STABILIZATION
   Akun/template adalah dependency editor, bukan data latar opsional.
================================================================ */
const ReferenceManager=(()=>{
  let promise=null;
  const required=()=>Auth.has('template.view')||Auth.has('account.view')?['accounts','templates']:['accounts'];
  function ready(){return required().every(k=>Store.isModuleReady(k))&&Store.referenceReady===true}
  async function hydrateCache(){
    if(!Auth.session)return false;
    const kinds=required(),results=await Promise.all(kinds.map(async kind=>{
      try{const cached=await ClientCache.getModule(kind);if(!cached)return false;const payload=cached.payload||cached.data||cached;if(!Array.isArray(payload?.rows))return false;Store.applyModule(kind,payload,true);Store.moduleMeta[kind]={...(Store.moduleMeta[kind]||{}),revision:String(cached.revision||payload.revision||''),complete_index:true,from_cache:true,cache_signature:String(cached.integrity?.signature||'')};return true}catch{return false}
    }));
    Store.referenceReady=results.every(Boolean);return Store.referenceReady
  }
  async function apply(pack,{persist=true}={}){
    if(!pack)return false;const rev=pack.revisions||{},when=pack.generated_at||Utils.isoNow();
    const accounts=Array.isArray(pack.accounts)?pack.accounts:[],templates=Array.isArray(pack.templates)?pack.templates:[];
    Store.applyModule('accounts',{kind:'accounts',rows:accounts,full:true,complete_index:true,revision:String(rev.accounts||''),generated_at:when},false);
    if(Auth.has('template.view'))Store.applyModule('templates',{kind:'templates',rows:templates,full:true,complete_index:true,revision:String(rev.templates||''),generated_at:when},false);
    Store.referenceReady=true;
    if(persist){await ClientCache.setModule('accounts',{revision:String(rev.accounts||''),generated_at:when,complete_index:true,payload:{kind:'accounts',rows:accounts,full:true,complete_index:true,revision:String(rev.accounts||''),generated_at:when}});if(Auth.has('template.view'))await ClientCache.setModule('templates',{revision:String(rev.templates||''),generated_at:when,complete_index:true,payload:{kind:'templates',rows:templates,full:true,complete_index:true,revision:String(rev.templates||''),generated_at:when}})}
    window.dispatchEvent(new CustomEvent('mwg:references-ready'));return true
  }
  async function ensure({force=false}={}){
    if(!Auth.session)return false;if(!force&&ready())return true;if(promise)return promise;
    promise=(async()=>{if(!force&&await hydrateCache()&&ready())return true;const out=await API.call('getReferencePack',{}, {skipQueue:true});return apply(out,{persist:true})})().finally(()=>{promise=null});return promise
  }
  function reset(){promise=null;Store.referenceReady=false}
  return {ensure,apply,hydrateCache,ready,reset};
})();

/* ================================================================

   Cache tampil dulu. Server hanya mengirim perubahan dari SYNC_LOG.

const BackgroundSyncManager=(()=>{
  const SECONDARY=['hotIssues','footages','meetings','htmlDocuments'];
  let running=false,currentId='',cursor=0,timer=0,lastError='',initialHydrated=false,secondaryLoaded=new Set(),syncScheduled=0,lastInteraction=0,activityBound=false,boostedKind='';
  function bindActivity(){if(activityBound)return;activityBound=true;['pointerdown','keydown','input','wheel','touchstart'].forEach(type=>document.addEventListener(type,()=>{lastInteraction=Date.now()},{passive:true,capture:true}))}
  async function waitForIdle(minIdle=650,maxWait=2600){bindActivity();const started=Date.now();while(Date.now()-lastInteraction<minIdle&&Date.now()-started<maxWait)await new Promise(r=>setTimeout(r,100));}
  const state=()=>({running,currentId,cursor,error:lastError,total:2+SECONDARY.length,done:(Store.isModuleReady('briefs')?1:0)+(Store.isModuleReady('tasks')?1:0)+[...secondaryLoaded].length});
  function emit(id,status='done'){window.dispatchEvent(new CustomEvent('mwg:sync-module',{detail:{id,status,state:state()}}));window.dispatchEvent(new CustomEvent('mwg:sync-state',{detail:{id,status,state:state()}}));renderIndicator()}
  function derived(){if(Store.isModuleReady('briefs')&&Store.isModuleReady('tasks'))['calendar','kanban','reporting'].forEach(id=>{Store.markModule(id,{derived:true});emit(id,'done')})}
  async function hydrateKind(kind){try{const c=await ClientCache.getModule(kind);if(!c)return false;const p=c.payload||c.data||c;if(!Array.isArray(p.rows))return false;Store.applyModule(kind,{...p,full:true,complete_index:true},true);Store.moduleMeta[kind]={...(Store.moduleMeta[kind]||{}),revision:String(c.revision||p.revision||''),complete_index:true,from_cache:true};return true}catch{return false}}
  async function hydrateInitialCache(){if(initialHydrated)return true;initialHydrated=true;const meta=await ClientCache.getMeta('sync_v122').catch(()=>null);cursor=Number(meta?.cursor||0)||0;await Promise.all(['briefs','tasks'].map(hydrateKind));if(typeof CalendarModule!=='undefined')await CalendarModule.hydrateCachedDefault?.().catch(()=>false);derived();Promise.all(SECONDARY.map(async k=>{if(await hydrateKind(k))secondaryLoaded.add(k)})).then(()=>renderIndicator()).catch(()=>{});return true}
  async function persistKind(kind,payload){await Store.persistModule(kind,{...(payload||{}),full:true,complete_index:true}).catch(()=>{});}
  async function fullCore(){currentId='briefs';emit('briefs','running');const out=await API.call('getCoreIndexV122',{}, {skipQueue:true});Store.applyModule('briefs',{kind:'briefs',rows:out.briefs||[],full:true,complete_index:true,generated_at:out.generated_at},false);Store.applyModule('tasks',{kind:'tasks',rows:out.tasks||[],full:true,complete_index:true,generated_at:out.generated_at},false);await Promise.all([persistKind('briefs',{kind:'briefs',rows:Store.briefs,generated_at:out.generated_at}),persistKind('tasks',{kind:'tasks',rows:Store.tasks,generated_at:out.generated_at})]);cursor=Number(out.cursor||0)||cursor;await ClientCache.setMeta('sync_v122',{cursor});derived();emit('briefs','done');emit('tasks','done');currentId='';return out}
  async function fullCoreKind(kind){if(!['briefs','tasks'].includes(kind))return null;currentId=kind;emit(kind,'running');const out=await API.call('getModuleIndexV122',{kind},{skipQueue:true});Store.applyModule(kind,{kind,rows:out.rows||[],full:true,complete_index:true,generated_at:out.generated_at},false);await persistKind(kind,{kind,rows:Store[kind]||[],generated_at:out.generated_at});derived();emit(kind,'done');currentId='';return out}
  async function fullSecondary(kind){
    const permMap={hotIssues:'hotissue.view',footages:'footage.view',meetings:'meeting.view',htmlDocuments:'html.view'};
    if(permMap[kind]&&!Auth.has(permMap[kind]))return;currentId=kind;emit(kind,'running');const out=await API.call('getModuleIndexV122',{kind},{skipQueue:true});Store.applyModule(kind,{kind,rows:out.rows||[],full:true,complete_index:true,generated_at:out.generated_at},false);await persistKind(kind,{kind,rows:Store[kind]||[],generated_at:out.generated_at});secondaryLoaded.add(kind);emit(kind,'done');currentId=''}
  async function applyChanges(out){const mods=out?.modules||{};for(const [kind,p] of Object.entries(mods)){if(!p)continue;Store.applyModule(kind,{kind,rows:p.rows||[],deleted_ids:p.deleted_ids||[],full:false,complete_index:true,generated_at:out.generated_at},false);if(typeof CalendarModule!=='undefined'&&(kind==='briefs'||kind==='tasks'))CalendarModule.seedChangedRows?.(kind,p.rows||[]);await persistKind(kind,{kind,rows:Store[kind]||[],generated_at:out.generated_at});emit(kind,'done')}const refresh=[...new Set(out?.refresh_modules||[])],coreRefresh=refresh.filter(k=>['briefs','tasks'].includes(k));if(coreRefresh.length===2)await fullCore();else if(coreRefresh.length===1)await fullCoreKind(coreRefresh[0]);for(const kind of refresh){if(coreRefresh.includes(kind))continue;if(kind==='accounts'||kind==='templates'){try{await ReferenceManager.ensure({force:true});emit(kind,'done')}catch{}}else if(SECONDARY.includes(kind))await fullSecondary(kind)}derived()}
  async function syncDelta(){if(!cursor)return fullCore();const out=await API.call('getSyncChangesV122',{cursor},{skipQueue:true});if(out?.full_required)return fullCore();await applyChanges(out);cursor=Number(out?.cursor||cursor)||cursor;await ClientCache.setMeta('sync_v122',{cursor});Store.lastSyncAt=out?.generated_at||Utils.isoNow();return out}
  async function start(){if(running||!Auth.session)return;running=true;lastError='';bindActivity();renderIndicator();try{await hydrateInitialCache();await ReferenceManager.ensure().catch(()=>false);await syncDelta();setTimeout(()=>{try{CalendarModule.preloadDefault?.()}catch{}},80);const queue=SECONDARY.slice();while(queue.length){let kind='';if(boostedKind&&queue.includes(boostedKind)){kind=boostedKind;queue.splice(queue.indexOf(kind),1);boostedKind=''}else kind=queue.shift();if(!Store.isModuleReady(kind)){await waitForIdle();await fullSecondary(kind)}}await syncDelta().catch(()=>{});setTimeout(async()=>{await waitForIdle(900,4000);InsightTracker.preload?.().catch(()=>{})},900);setTimeout(async()=>{await waitForIdle(900,5000);AIStudio.preload?.().catch(()=>{})},1800)}catch(e){lastError=String(e?.message||e);console.warn('Simple sync:',lastError)}finally{running=false;currentId='';renderIndicator();schedulePolling()}}
  function schedulePolling(){clearTimeout(timer);if(!Auth.session)return;timer=setTimeout(async()=>{if(document.hidden){schedulePolling();return}try{await refreshAll()}catch{}},90000)}
  function scheduleSync(delay=500){clearTimeout(syncScheduled);syncScheduled=setTimeout(()=>{refreshAll().catch(()=>{})},delay)}
  async function refreshAll(){if(running||!Auth.session)return;running=true;renderIndicator();try{await syncDelta()}catch(e){lastError=String(e?.message||e)}finally{running=false;currentId='';renderIndicator();schedulePolling()}}
  async function refreshCore(){return refreshAll()}
  function routeReady(){return true}
  function waitingHtml(){return ''}
  function boostRoute(route){const map={hotissues:'hotIssues',footages:'footages',meetings:'meetings',htmlfiles:'htmlDocuments'},kind=map[route];if(!kind||Store.isModuleReady(kind))return;if(running){boostedKind=kind;return}running=true;currentId=kind;renderIndicator();(async()=>{try{await fullSecondary(kind)}catch(e){lastError=String(e?.message||e)}finally{running=false;currentId='';renderIndicator();schedulePolling()}})()}
  function boost(){ }
  function renderIndicator(){const el=Utils.q('#globalSyncIndicator');if(!el)return;let label='Data siap',short='✓',cls='ok';if(running){label=currentId?`Sinkron ${currentId}`:'Memeriksa perubahan';short='↻';cls='syncing'}if(lastError){label='Data cache aktif • sync tertunda';short='⚠';cls='warn'}el.className='sync-indicator '+cls;el.innerHTML=`<span class="sync-dot"></span><span class="sync-label">${Utils.esc(label)}</span><span class="sync-short">${short}</span>`;el.title=label}
  function retryErrors(){lastError='';scheduleSync(50)}
  function reset(){clearTimeout(timer);clearTimeout(syncScheduled);running=false;currentId='';cursor=0;lastError='';initialHydrated=false;secondaryLoaded=new Set();boostedKind='';renderIndicator()}
  return {start,hydrateInitialCache,boost,boostRoute,routeReady,waitingHtml,state,renderIndicator,retryErrors,refreshAll,refreshCore,reset,scheduleSync};
})();

const FormDraft = (() => {
  const PREFIX='mwg_form_draft_v160_';
  const userKey=()=>Auth.session?.user?.id||Auth.session?.user?.username||'guest';
  const key=(entity,id)=>`${PREFIX}${userKey()}_${entity}_${id||'new'}`;
  function capture(form,extra){
    const counters={},fields=[];
    [...form.elements].forEach(el=>{if(!el.name||['button','submit','file'].includes(el.type))return;const i=counters[el.name]||0;counters[el.name]=i+1;fields.push({name:el.name,index:i,type:el.type,value:el.value,checked:!!el.checked})});
    return {saved_at:Date.now(),fields,extra:extra?extra():null};
  }
  function restore(form,data,before){
    if(before)before(data.extra||null);
    (data.fields||[]).forEach(item=>{const els=[...form.elements].filter(x=>x.name===item.name),el=els[item.index||0];if(!el)return;if(['checkbox','radio'].includes(item.type))el.checked=!!item.checked;else el.value=item.value??''});
    form.dispatchEvent(new Event('change',{bubbles:true}));
  }
  function attach(form,{entity,recordId,captureExtra,restoreExtra}){
    const draftKey=key(entity,recordId),raw=localStorage.getItem(draftKey);let timer=null;
    const bar=document.createElement('div');bar.className='draft-bar';
    const saved=raw?Utils.parseJSON(raw,null):null;
    bar.innerHTML=saved?`<div><strong>Draft lokal ditemukan</strong><span>Disimpan ${Utils.formatDateTime(new Date(saved.saved_at).toISOString())}</span><div class="draft-save-note" data-draft-status>Autosave aktif</div></div><div class="actions"><button type="button" class="btn btn-sm btn-primary" data-draft-restore>Lanjutkan</button><button type="button" class="btn btn-sm" data-draft-discard>Buang</button></div>`:`<div><strong>Autosave aktif</strong><span>Isian disimpan sementara di perangkat.</span><div class="draft-save-note" data-draft-status>Belum ada perubahan</div></div>`;
    form.prepend(bar);
    const status=bar.querySelector('[data-draft-status]');
    const save=()=>{try{localStorage.setItem(draftKey,JSON.stringify(capture(form,captureExtra)));if(status)status.textContent='Draft tersimpan • '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}catch(e){}};
    const schedule=()=>{clearTimeout(timer);timer=setTimeout(save,700)};
    form.addEventListener('input',schedule);form.addEventListener('change',schedule);
    bar.querySelector('[data-draft-restore]')?.addEventListener('click',()=>{restore(form,saved,restoreExtra);Utils.toast('Draft lokal dipulihkan','success');bar.querySelector('.actions')?.remove()});
    bar.querySelector('[data-draft-discard]')?.addEventListener('click',()=>{localStorage.removeItem(draftKey);bar.remove();Utils.toast('Draft lokal dibuang')});
    return {clear(){clearTimeout(timer);localStorage.removeItem(draftKey)},save,draftKey};
  }
  return {attach};
})();

const ErrorReporter = (() => {
  const KEY='MWG_ERROR_DEDUP_V1222',TTL=10*60*1000,MAX=80;
  let sending=false,initialized=false,lastSentAt=0;
  function messageOf(error){return String(error?.message||error||'Unknown error').trim()||'Unknown error'}
  function shouldIgnore(error,context={}){
    const msg=messageOf(error),file=String(context.file||'');
    // JSONP/cross-origin dan ekstensi browser sering hanya memunculkan "Script error."
    // tanpa stack/filename yang dapat ditindaklanjuti. Error API sebenarnya sudah ditangani API.call/jsonpCall.
    if(/^script error\.?$/i.test(msg))return true;
    if(/^(chrome|moz|safari-web)-extension:/i.test(file))return true;
    return false;
  }
  function fingerprint(source,error,context={}){return [source,location.hash.slice(1),messageOf(error),context.file||'',context.line||'',context.column||''].join('|').slice(0,1200)}
  function seenRecently(key){
    const now=Date.now();let rows=[];try{rows=JSON.parse(sessionStorage.getItem(KEY)||'[]');if(!Array.isArray(rows))rows=[]}catch{rows=[]}
    rows=rows.filter(x=>x&&now-Number(x.t||0)<TTL);if(rows.some(x=>x.k===key)){try{sessionStorage.setItem(KEY,JSON.stringify(rows.slice(-MAX)))}catch{}return true}
    rows.push({k:key,t:now});try{sessionStorage.setItem(KEY,JSON.stringify(rows.slice(-MAX)))}catch{}return false
  }
  async function send(source,error,context={}){
    if(!Auth.session||!navigator.onLine||API.isDemo()||shouldIgnore(error,context))return;
    const fp=fingerprint(source,error,context);if(seenRecently(fp)||sending||Date.now()-lastSentAt<3000)return;
    sending=true;lastSentAt=Date.now();try{await API.call('logClientError',{source,action:context.action||'',page:location.hash.slice(1),message:messageOf(error),stack:String(error?.stack||''),context},{skipQueue:true})}catch{}finally{sending=false}
  }
  function init(){if(initialized)return;initialized=true;window.addEventListener('error',e=>send('window.error',e.error||e.message,{file:e.filename||'',line:e.lineno||0,column:e.colno||0}));window.addEventListener('unhandledrejection',e=>send('unhandledrejection',e.reason||'Promise rejected'))}
  return {send,init};
})();

    if(root)root.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb;font-family:system-ui"><div style="max-width:520px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:24px"><strong style="display:block;font-size:18px;color:#4a1028;margin-bottom:8px">Aplikasi gagal memulai</strong><div style="font-size:13px;color:#64748b;line-height:1.6">Muat ulang halaman. Jika masih terjadi, buka Pengaturan setelah aplikasi pulih dan periksa koneksi.</div></div></div>';
  });
  Config.loadRemote().then(out=>{
    if(!out?.ok)console.warn('Config pusat tidak tersedia, memakai fallback:',out?.error||'');
  }).catch(()=>{});
});
</script>
</body>
</html>
